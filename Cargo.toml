# The four report importers, extracted from `oaRustCore` and filed as a softapp.
#
# Owns: building the importer library and the four `test_*` runners that read
# `test_data/` beside them. It reads somebody else's report format and publishes
# a record; it addresses no hardware, which is why it lives under `Softapps/`
# and not in `BareMetal/Core/` where it was compiled until PLAN-603.01.
#
# Must not: gain a `[workspace]` key. No Cargo.toml sits above this directory, so
# the crate is its own workspace root already, and declaring the section would
# claim any crate a later session files beside it under `Softapps/`.
#
# `path = "mod.rs"` rather than a `src/` layout: `mod.rs` reaches its one own
# module, the data editor, with a `#[path]` into this repository's own folder.
#
# THE IMPORTERS ARE CRATES WITH ONE OWNER EACH (2026-10-30 audit). Each
# DATATYPE.wireless.* repository owns its parser as a crate in `SRC/importer/`
# and builds its own worker on it; this crate depends on the four by git rev
# and re-exports them under their historical module names (`mod.rs`), so
# `oaRustCore::data_migration::csv_importer::…` still resolves. It compiles no
# other repository's file by `#[path]` and builds none of their runners: each
# importer's fixture test lives in its own repository. Its own code is the data
# editor, and `tests/frame_headers.rs` (the frames ⊆ records contract).
#
# In the monorepo the git-excluded `.cargo/config.toml` patches the four back
# to the checkout; NODE.BareMetal's Core (which depends on this crate by rev)
# carries the same patches. It patches the test-only PDF importer
# (DATATYPE.wireless.PDF, a dev-dependency Core never sees) the same way. Bumping an importer is editing its rev here.
#
# DEPENDS ON NOTHING OF NODE.BareMetal: the dependency between this crate and
# oaRustCore runs one way (Core → this), so there is no cycle.

[package]
name = "apkaudio-data-migration"
version = "2.0.0"
edition = "2021"

[lib]
name = "apkaudio_data_migration"
path = "mod.rs"

[dependencies]
apkaudio-wireless-ias = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.IAS", rev = "d66068b4f08fcd4ab42b9d14259f03907ca8b84e" }
apkaudio-wireless-soundbase = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.SOUNDbase", rev = "303da7d6062feecff7caae2cf288b7f21d101b54" }
apkaudio-wireless-wwb = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.SHUREwirelessWorkbench", rev = "9ae35518f12502a5d30859612b621eb5a1423f10" }
apkaudio-wireless-csv = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.CSV", rev = "8b94322b1ae73bf3414ea69530b69980e6cd92d0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Test-only: the SoundBase table also draws the wireless_pdf worker's records
# (its `also_topics`), so `tests/frame_headers.rs` checks the headers against
# the PDF importer's record too. Not re-exported — a dev-dependency never
# reaches NODE.BareMetal's Core, which depends on this crate by rev.
[dev-dependencies]
apkaudio-wireless-soundbase-pdf = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.PDF", rev = "2ebeefa04b95ab74f9b14de01e4feb495eac2df6" }
